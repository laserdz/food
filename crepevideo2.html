<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>LASER FOOD — Écran 4 Desserts</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --violet: #7B2FFF;
    --cyan: #00E5FF;
    --rouge: #FF2D55;
    --or: #FFD700;
    --orange: #FF6B00;
    --rose: #FF2D78;
    --noir: #050508;
    --blanc: #FFFFFF;
    --gris: #8A8A9A;
  }

  body {
    width: 1920px;
    height: 1080px;
    background: var(--noir);
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* ===== FOND LASER PREMIUM ===== */
  .laser-bg {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    animation: bgPulse 8s infinite ease-in-out;
  }

  @keyframes bgPulse {
    0%, 100% {
      background:
        radial-gradient(ellipse at 20% 40%, rgba(123,47,255,0.22) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 60%, rgba(255,45,120,0.12) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 100%, rgba(0,229,255,0.08) 0%, transparent 50%);
    }
    50% {
      background:
        radial-gradient(ellipse at 30% 50%, rgba(123,47,255,0.35) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 40%, rgba(255,45,120,0.2) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 90%, rgba(0,229,255,0.15) 0%, transparent 50%);
    }
  }

  .star-field {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.8;
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.95) 0 1px, transparent 1.8px),
      radial-gradient(circle, rgba(0,229,255,0.75) 0 1px, transparent 1.6px),
      radial-gradient(circle, rgba(123,47,255,0.65) 0 1px, transparent 1.5px);
    background-size: 190px 190px, 260px 260px, 340px 340px;
    background-position: 0 0, 70px 110px, 140px 40px;
    animation: starDrift 34s linear infinite;
  }
  @keyframes starDrift {
    0% { transform: translate3d(0,0,0); }
    100% { transform: translate3d(-190px,90px,0); }
  }

  .laser-grid {
    position: absolute;
    inset: auto -10% -25% -10%;
    height: 45%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.18;
    transform: perspective(520px) rotateX(62deg);
    transform-origin: bottom center;
    background-image:
      linear-gradient(rgba(0,229,255,0.3) 1px, transparent 1px),
      linear-gradient(90deg, rgba(123,47,255,0.25) 1px, transparent 1px);
    background-size: 80px 80px;
    animation: gridMove 7s linear infinite;
  }
  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 80px; }
  }

  .laser-sweep {
    position: absolute;
    left: -30%;
    top: var(--top);
    width: 160%;
    height: var(--h);
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(90deg, transparent 0%, var(--color) 45%, #fff 50%, var(--color) 55%, transparent 100%);
    box-shadow: 0 0 18px var(--color), 0 0 42px var(--color);
    opacity: 0;
    transform: rotate(var(--rot)) translateX(-45%);
    filter: blur(0.4px);
    mix-blend-mode: screen;
    animation: laserSweep var(--duration) infinite ease-in-out;
    animation-delay: var(--delay);
  }
  @keyframes laserSweep {
    0%,14% { opacity:0; transform:rotate(var(--rot)) translateX(-55%); }
    22% { opacity:0.8; }
    52%,100% { opacity:0; transform:rotate(var(--rot)) translateX(55%); }
  }

  .shooting-star {
    position: absolute;
    top: var(--top);
    left: var(--left);
    width: var(--len);
    height: 2px;
    z-index: 2;
    pointer-events: none;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(255,255,255,0), var(--color), #fff);
    box-shadow: 0 0 12px var(--color), 0 0 30px var(--color);
    opacity: 0;
    animation: shootingStar var(--duration) infinite cubic-bezier(.25,.7,.35,1);
    animation-delay: var(--delay);
  }
  @keyframes shootingStar {
    0%,6% { opacity:0; transform:rotate(var(--rot)) translate3d(-180px,0,0); }
    10% { opacity:1; }
    42%,100% { opacity:0; transform:rotate(var(--rot)) translate3d(1180px,0,0); }
  }

  .energy-orb {
    position: absolute;
    width: 8px; height: 8px;
    z-index: 2;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan), 0 0 25px var(--cyan), 0 0 55px var(--violet);
    opacity: 0.65;
    animation: orbFloat 9s infinite ease-in-out;
  }
  .energy-orb:nth-of-type(1) { left:8%; top:72%; animation-delay:-1s; }
  .energy-orb:nth-of-type(2) { left:48%; top:18%; animation-delay:-4s; background:var(--violet); }
  .energy-orb:nth-of-type(3) { left:88%; top:64%; animation-delay:-6s; }
  @keyframes orbFloat {
    0%,100% { transform:translate3d(0,0,0) scale(0.7); opacity:0.25; }
    35% { transform:translate3d(40px,-34px,0) scale(1.25); opacity:0.9; }
    70% { transform:translate3d(-28px,22px,0) scale(0.9); opacity:0.55; }
  }

  .laser-line {
    position: absolute;
    height: 2px;
    width: 100%;
  }
  .laser-line:nth-child(11) { top:25%; background:linear-gradient(90deg,transparent,var(--rose),transparent); box-shadow:0 0 8px var(--rose); animation:lsw1 5s infinite ease-in-out; }
  .laser-line:nth-child(12) { top:55%; background:linear-gradient(90deg,transparent,var(--violet),transparent); box-shadow:0 0 8px var(--violet); animation:lsw2 6s infinite ease-in-out; }
  .laser-line:nth-child(13) { top:80%; background:linear-gradient(90deg,transparent,var(--cyan),transparent); box-shadow:0 0 6px var(--cyan); animation:lsw3 7s infinite ease-in-out; }
  @keyframes lsw1 { 0%,100%{transform:rotate(-6deg);opacity:0.3;} 50%{transform:rotate(-3deg);opacity:0.65;} }
  @keyframes lsw2 { 0%,100%{transform:rotate(4deg);opacity:0.25;} 50%{transform:rotate(7deg);opacity:0.6;} }
  @keyframes lsw3 { 0%,100%{transform:rotate(-3deg);opacity:0.25;} 50%{transform:rotate(-6deg);opacity:0.55;} }

  /* HEADER */
  .header {
    position: absolute;
    top:0; left:0; right:0;
    height: 80px;
    background: linear-gradient(180deg, rgba(0,0,0,0.95), transparent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 60px;
    z-index: 10;
    border-bottom: 1px solid rgba(255,45,120,0.3);
  }
  .brand { display:flex; align-items:center; gap:16px; }
  .brand-icon {
    width:44px; height:44px;
    background: var(--rouge);
    clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  .brand-name {
    font-family:'Orbitron',monospace;
    font-size:28px; font-weight:900;
    color:var(--blanc); letter-spacing:4px;
    text-shadow:0 0 20px var(--violet);
  }
  .brand-name span { color:var(--rouge); }
  .header-tag {
    font-family:'Bebas Neue',sans-serif;
    font-size:18px; letter-spacing:6px; color:var(--gris);
  }
  .header-tag span { color:var(--rose); }

  /* ===== MAIN LAYOUT ===== */
  .main {
    position: absolute;
    top:80px; left:0; right:0; bottom:44px;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    z-index: 5;
    padding: 20px 40px;
  }

  .divider-v {
    background: linear-gradient(180deg, transparent, rgba(255,45,120,0.4), rgba(123,47,255,0.3), transparent);
    margin: 0 20px;
  }

  /* ===== SECTION LABELS ===== */
  .section-label {
    font-family:'Bebas Neue',sans-serif;
    font-size:20px; letter-spacing:8px;
    color:var(--gris);
    padding-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    margin-bottom:14px;
  }
  .section-label.shake span { color:var(--rose); }
  .section-label.crepe span { color:var(--or); }

  /* ===== MILK-SHAKES (GAUCHE) ===== */
  .shakes-col {
    display:flex;
    flex-direction:column;
    gap:12px;
    padding-right:20px;
  }

  /* HÉROS VIDÉO */
  .hero-video-card {
    position:relative;
    border-radius:14px;
    overflow:hidden;
    border:1px solid rgba(255,45,120,0.25);
    background:rgba(0,0,0,0.5);
    height:480px;
    flex-shrink:0;
  }

  .hero-video-card::after {
    content:'';
    position:absolute;
    inset:0;
    background:
      linear-gradient(to right, rgba(5,5,8,0.5) 0%, transparent 15%, transparent 85%, rgba(5,5,8,0.5) 100%),
      linear-gradient(to bottom, rgba(5,5,8,0.3) 0%, transparent 15%, transparent 75%, rgba(5,5,8,0.9) 100%);
    z-index:2;
    pointer-events:none;
  }

  .hero-video {
    width:100%; height:100%;
    object-fit:contain;
    object-position:center top;
    display:block;
  }

  .hero-overlay {
    position:absolute;
    bottom:0; left:0; right:0;
    padding:18px 22px;
    z-index:3;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }

  .hero-name {
    font-family:'Bebas Neue',sans-serif;
    font-size:42px; color:var(--blanc);
    letter-spacing:3px; line-height:1;
    text-shadow:0 0 20px rgba(255,45,120,0.6);
  }
  .hero-sub {
    font-size:13px; color:#AAAACC;
    text-transform:uppercase; letter-spacing:2px;
    margin-top:4px;
  }
  .hero-price {
    font-family:'Bebas Neue',sans-serif;
    font-size:52px; color:var(--or);
    line-height:1;
    text-shadow:0 0 20px rgba(255,215,0,0.4);
  }
  .hero-price span { font-size:24px; opacity:0.7; }

  /* MINI SHAKES */
  .mini-shakes {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    flex:1;
  }

  .mini-shake-card {
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,45,120,0.15);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .mini-shake-img {
    width:100%; height:280px;
    object-fit:contain;
    object-position:center top;
    display:block;
    background: radial-gradient(ellipse at center bottom, rgba(255,45,120,0.08) 0%, transparent 70%);
  }

  .mini-shake-body {
    padding:10px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .mini-shake-name {
    font-family:'Bebas Neue',sans-serif;
    font-size:26px; color:var(--blanc);
    letter-spacing:2px; line-height:1;
  }
  .mini-shake-price {
    font-family:'Bebas Neue',sans-serif;
    font-size:28px; color:var(--or);
    text-shadow:0 0 10px rgba(255,215,0,0.3);
  }
  .mini-shake-price span { font-size:14px; opacity:0.7; }

  /* ===== CRÊPES (DROITE) ===== */
  .crepes-col {
    display:flex;
    flex-direction:column;
    gap:12px;
    padding-left:20px;
  }

  /* HÉROS CRÊPE */
  .hero-crepe-card {
    position:relative;
    border-radius:14px;
    overflow:hidden;
    border:1px solid rgba(255,215,0,0.25);
    background:rgba(0,0,0,0.5);
    height:480px;
    flex-shrink:0;
  }

  .hero-crepe-card::after {
    content:'';
    position:absolute;
    inset:0;
    background:
      linear-gradient(to right, rgba(5,5,8,0.3) 0%, transparent 15%, transparent 85%, rgba(5,5,8,0.3) 100%),
      linear-gradient(to bottom, rgba(5,5,8,0.2) 0%, transparent 15%, transparent 75%, rgba(5,5,8,0.9) 100%);
    z-index:2;
    pointer-events:none;
  }

  .hero-crepe-img {
    width:100%; height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
  }

  .hero-crepe-overlay {
    position:absolute;
    bottom:0; left:0; right:0;
    padding:18px 22px;
    z-index:3;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }

  .hero-crepe-name {
    font-family:'Bebas Neue',sans-serif;
    font-size:38px; color:var(--blanc);
    letter-spacing:2px; line-height:1;
    text-shadow:0 0 20px rgba(255,215,0,0.5);
  }
  .hero-crepe-sub {
    font-size:13px; color:#AAAACC;
    text-transform:uppercase; letter-spacing:1px;
    margin-top:4px;
  }
  .hero-crepe-price {
    font-family:'Bebas Neue',sans-serif;
    font-size:52px; color:var(--or);
    line-height:1;
    text-shadow:0 0 20px rgba(255,215,0,0.4);
  }
  .hero-crepe-price span { font-size:24px; opacity:0.7; }

  /* MINI CRÊPES */
  .mini-crepes {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    flex:1;
  }

  .mini-crepe-card {
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,215,0,0.15);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .mini-crepe-img {
    width:100%; height:150px;
    object-fit:cover;
    object-position:center;
    display:block;
  }

  .mini-crepe-body {
    padding:10px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .mini-crepe-name {
    font-family:'Bebas Neue',sans-serif;
    font-size:22px; color:var(--blanc);
    letter-spacing:1px; line-height:1.1;
  }
  .mini-crepe-price {
    font-family:'Bebas Neue',sans-serif;
    font-size:28px; color:var(--or);
    text-shadow:0 0 10px rgba(255,215,0,0.3);
    white-space:nowrap;
  }
  .mini-crepe-price span { font-size:14px; opacity:0.7; }

  /* FOOTER */
  .footer {
    position:absolute;
    bottom:0; left:0; right:0;
    height:44px;
    background:rgba(0,0,0,0.8);
    border-top:1px solid rgba(255,45,120,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:60px;
    z-index:10;
  }
  .footer-item {
    font-family:'Bebas Neue',sans-serif;
    font-size:14px; letter-spacing:4px; color:var(--gris);
  }
  .footer-dot { width:4px; height:4px; border-radius:50%; background:var(--rose); }

  .bottom-glow {
    position:absolute;
    bottom:44px; left:50%;
    transform:translateX(-50%);
    width:600px; height:2px;
    background:linear-gradient(90deg, transparent, var(--rose), var(--violet), transparent);
    opacity:0.4;
    z-index:9;
  }
</style>
</head>
<body>

<!-- FOND LASER -->
<div class="laser-bg">
  <div class="star-field"></div>
  <div class="laser-grid"></div>

  <div class="laser-sweep" style="--top:18%;--h:3px;--rot:-8deg;--color:var(--rose);--duration:6.5s;--delay:-1s;"></div>
  <div class="laser-sweep" style="--top:42%;--h:2px;--rot:6deg;--color:var(--violet);--duration:8s;--delay:-3s;"></div>
  <div class="laser-sweep" style="--top:72%;--h:3px;--rot:-5deg;--color:var(--cyan);--duration:7.2s;--delay:-5s;"></div>

  <div class="shooting-star" style="--top:10%;--left:5%;--len:160px;--rot:22deg;--color:var(--rose);--duration:5.2s;--delay:-1s;"></div>
  <div class="shooting-star" style="--top:35%;--left:45%;--len:130px;--rot:18deg;--color:var(--violet);--duration:6.8s;--delay:-3s;"></div>
  <div class="shooting-star" style="--top:60%;--left:15%;--len:200px;--rot:-15deg;--color:var(--cyan);--duration:7.4s;--delay:-5s;"></div>
  <div class="shooting-star" style="--top:80%;--left:55%;--len:150px;--rot:12deg;--color:var(--rose);--duration:6.1s;--delay:-2s;"></div>

  <div class="energy-orb"></div>
  <div class="energy-orb"></div>
  <div class="energy-orb"></div>

  <div class="laser-line"></div>
  <div class="laser-line"></div>
  <div class="laser-line"></div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="brand">
    <div class="brand-icon">⚡</div>
    <div class="brand-name">LASER <span>FOOD</span></div>
  </div>
  <div class="header-tag">NOS <span>DESSERTS</span></div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- GAUCHE : MILK-SHAKES -->
  <div class="shakes-col">
    <div class="section-label shake">MILK <span>SHAKES</span></div>

    <!-- HÉROS CHOCOLAT VIDÉO -->
    <div class="hero-video-card">
      <video class="hero-video shake-vid" autoplay loop muted playsinline
        onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <source src="shake1.mp4" type="video/mp4">
      </video>
      <img src="shake1.png" alt="Milk-shake Chocolat" style="display:none;width:100%;height:100%;object-fit:cover;" />
      <div class="hero-overlay">
        <div>
          <div class="hero-name">CHOCOLAT</div>
          <div class="hero-sub">Milk-shake · Chantilly · Copeaux choco</div>
        </div>
        <div class="hero-price">500 <span>DA</span></div>
      </div>
    </div>

    <!-- MINI : VANILLE + FRAISE (vidéos) -->
    <div class="mini-shakes">
      <div class="mini-shake-card">
        <video class="mini-shake-img shake-vid" autoplay loop muted playsinline
          style="object-fit:contain;object-position:center top;"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <source src="shake2.mp4" type="video/mp4">
        </video>
        <img class="mini-shake-img" src="shake2.png" alt="Vanille" style="display:none;" />
        <div class="mini-shake-body">
          <div class="mini-shake-name">VANILLE</div>
          <div class="mini-shake-price">500 <span>DA</span></div>
        </div>
      </div>
      <div class="mini-shake-card">
        <video class="mini-shake-img shake-vid" autoplay loop muted playsinline
          style="object-fit:contain;object-position:center top;"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <source src="shake3.mp4" type="video/mp4">
        </video>
        <img class="mini-shake-img" src="shake3.png" alt="Fraise" style="display:none;" />
        <div class="mini-shake-body">
          <div class="mini-shake-name">FRAISE</div>
          <div class="mini-shake-price">500 <span>DA</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- DIVIDER -->
  <div class="divider-v"></div>

  <!-- DROITE : CRÊPES -->
  <div class="crepes-col">
    <div class="section-label crepe">NOS <span>CRÊPES</span></div>

    <!-- GRILLE 2x2 ÉGALE -->
    <div style="display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;flex:1;">

      <div class="mini-crepe-card">
        <img class="mini-crepe-img" src="crepe_banane.png" alt="Banane" style="height:200px;" />
        <div class="mini-crepe-body">
          <div class="mini-crepe-name">BANANE</div>
          <div class="mini-crepe-price">500 <span>DA</span></div>
        </div>
      </div>

      <div class="mini-crepe-card">
        <img class="mini-crepe-img" src="crepe_mordjene.png" alt="El Mordjene Choco" style="height:200px;" />
        <div class="mini-crepe-body">
          <div class="mini-crepe-name">EL MORDJENE CHOCO</div>
          <div class="mini-crepe-price">400 <span>DA</span></div>
        </div>
      </div>

      <div class="mini-crepe-card">
        <img class="mini-crepe-img" src="crepe_noisette.png" alt="El Mordjene Noisette" style="height:200px;" />
        <div class="mini-crepe-body">
          <div class="mini-crepe-name">EL MORDJENE NOISETTE</div>
          <div class="mini-crepe-price">400 <span>DA</span></div>
        </div>
      </div>

      <div class="mini-crepe-card">
        <img class="mini-crepe-img" src="crepe_miel.png" alt="Miel" style="height:200px;" />
        <div class="mini-crepe-body">
          <div class="mini-crepe-name">MIEL</div>
          <div class="mini-crepe-price">350 <span>DA</span></div>
        </div>
      </div>

    </div>
  </div>

</div>

<div class="bottom-glow"></div>

<!-- FOOTER -->
<div class="footer">
  <span class="footer-item">LASER FOOD</span>
  <div class="footer-dot"></div>
  <span class="footer-item">MILK-SHAKES & CRÊPES</span>
  <div class="footer-dot"></div>
  <span class="footer-item">FAITS MAISON</span>
  <div class="footer-dot"></div>
  <span class="footer-item">ALGER</span>
</div>

<script>
function startShakeVideos() {
  document.querySelectorAll('.shake-vid').forEach(function(video) {
    const img = video.nextElementSibling;
    video.play().then(function() {
      video.style.display = 'block';
      if (img && img.tagName === 'IMG') img.style.display = 'none';
    }).catch(function() {
      video.style.display = 'none';
      if (img && img.tagName === 'IMG') img.style.display = 'block';
    });
    video.addEventListener('error', function() {
      video.style.display = 'none';
      if (img && img.tagName === 'IMG') img.style.display = 'block';
    });
  });
}
document.addEventListener('DOMContentLoaded', startShakeVideos);
document.addEventListener('touchstart', function() {
  document.querySelectorAll('.shake-vid').forEach(function(v) {
    if (v.paused) v.play();
  });
}, { once: true });
</script>

</body>
